{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 420px;">
  <div class="text-center mb-4">
    <span class="brand-mark d-inline-flex" style="width:44px;height:44px;font-size:1.2rem;">R</span>
    <h3 class="fw-bold mt-3 mb-1">Welcome back</h3>
    <p class="text-muted">Log in to continue to your dashboard.</p>
  </div>
  <div class="card p-4">
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Log In</button>
    </form>
  </div>
  <p class="text-center text-muted mt-3">Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
</div>
{% endblock %}
