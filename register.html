{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <div class="text-center mb-4">
    <span class="brand-mark d-inline-flex" style="width:44px;height:44px;font-size:1.2rem;">R</span>
    <h3 class="fw-bold mt-3 mb-1">Create your account</h3>
    <p class="text-muted">It's free — start analyzing your resume in minutes.</p>
  </div>
  <div class="card p-4">
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="name">Full Name</label>
        <input class="form-control" type="text" id="name" name="name" placeholder="Jane Smith" value="{{ form_data.name if form_data else '' }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" value="{{ form_data.email if form_data else '' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input class="form-control" type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Create Account</button>
    </form>
  </div>
  <p class="text-center text-muted mt-3">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
