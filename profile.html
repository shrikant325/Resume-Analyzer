{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 640px;">
  <h2 class="fw-bold mb-1">Your Profile</h2>
  <p class="text-muted mb-4">Manage your account details.</p>

  <div class="card p-4 mb-4">
    <h6 class="fw-bold mb-3">Account Information</h6>
    <form method="POST" action="{{ url_for('main.profile') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="name">Full Name</label>
        <input class="form-control" type="text" id="name" name="name" value="{{ current_user.name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" value="{{ current_user.email }}" disabled>
        <div class="form-text">Email address cannot be changed.</div>
      </div>
      <div class="mb-0">
        <label class="form-label">Member Since</label>
        <input class="form-control" type="text" value="{{ current_user.created_at|dt('%B %d, %Y') }}" disabled>
      </div>
      <button type="submit" class="btn btn-primary mt-3">Update Profile</button>
    </form>
  </div>

  <div class="card p-4">
    <h6 class="fw-bold mb-3">Change Password</h6>
    <form method="POST" action="{{ url_for('main.change_password') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="current_password">Current Password</label>
        <input class="form-control" type="password" id="current_password" name="current_password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="new_password">New Password</label>
        <input class="form-control" type="password" id="new_password" name="new_password" minlength="6" required>
      </div>
      <div class="mb-0">
        <label class="form-label" for="confirm_new_password">Confirm New Password</label>
        <input class="form-control" type="password" id="confirm_new_password" name="confirm_new_password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-outline-primary mt-3">Change Password</button>
    </form>
  </div>
</div>
{% endblock %}
